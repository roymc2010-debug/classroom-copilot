<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        indigo: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom Scrollbar for chat */
        #chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #1e293b;
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-700">
            <h1 class="text-3xl font-bold text-indigo-400"><i class="fa-solid fa-graduation-cap mr-2"></i>Classroom Manager</h1>
            <button id="refresh-btn" class="bg-slate-800 hover:bg-slate-700 text-white p-2 rounded-full transition-colors" onclick="loadTasks()">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
        </header>

        <div id="loading" class="text-center py-10">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-indigo-500 mb-4"></i>
            <p class="text-slate-400">Cargando tareas...</p>
        </div>

        <div id="auth-warning" class="hidden bg-yellow-900/50 border border-yellow-600 text-yellow-200 p-4 rounded-lg mb-6">
            <p><i class="fa-solid fa-triangle-exclamation mr-2"></i> Se requiere autenticación de Google. Revisa la consola del servidor para iniciar sesión o asegúrate de tener credentials.json.</p>
        </div>

        <main id="tasks-container" class="hidden">
            <h2 class="text-xl font-semibold mb-4 text-slate-300">Próximas Entregas</h2>
            <div id="timeline" class="space-y-4 mb-8">
                <!-- Tasks will be injected here -->
            </div>

            <details class="group bg-slate-800 rounded-lg overflow-hidden border border-slate-700 mb-8">
                <summary class="cursor-pointer p-4 font-semibold text-slate-300 flex justify-between items-center hover:bg-slate-700/50 transition-colors">
                    <span>Tareas sin fecha límite (<span id="no-date-count">0</span>)</span>
                    <i class="fa-solid fa-chevron-down transition-transform group-open:rotate-180"></i>
                </summary>
                <div id="no-date-tasks" class="p-4 space-y-4 bg-slate-800/50 border-t border-slate-700">
                    <!-- No date tasks here -->
                </div>
            </details>
        </main>
    </div>

    <!-- Copilot Modal -->
    <div id="copilot-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 rounded-xl w-full max-w-2xl border border-slate-700 flex flex-col h-[85vh] shadow-2xl">
            <!-- Header -->
            <div class="p-4 border-b border-slate-700 flex justify-between items-start bg-slate-800 rounded-t-xl">
                <div class="pr-8">
                    <h3 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> Copilot
                    </h3>
                    <p id="modal-task-title" class="text-sm text-slate-400 mt-1 line-clamp-1"></p>
                </div>
                <button onclick="closeCopilot()" class="text-slate-400 hover:text-white absolute top-4 right-4">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Model Selection -->
            <div class="p-3 bg-slate-900/50 border-b border-slate-700 flex gap-2 overflow-x-auto text-sm">
                <label class="flex items-center gap-2 cursor-pointer bg-slate-800 px-3 py-1.5 rounded-full border border-slate-600 hover:border-indigo-500 transition-colors">
                    <input type="radio" name="ai_provider" value="gemini" checked class="accent-indigo-500">
                    <span>Gemini</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer bg-slate-800 px-3 py-1.5 rounded-full border border-slate-600 hover:border-indigo-500 transition-colors">
                    <input type="radio" name="ai_provider" value="groq" class="accent-indigo-500">
                    <span>Groq (Llama3)</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer bg-slate-800 px-3 py-1.5 rounded-full border border-slate-600 hover:border-indigo-500 transition-colors">
                    <input type="radio" name="ai_provider" value="openrouter" class="accent-indigo-500">
                    <span>OpenRouter</span>
                </label>
            </div>

            <!-- Chat Area -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-900">
                <div class="flex items-start gap-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-robot text-xs"></i>
                    </div>
                    <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 text-sm">
                        ¡Hola! Estoy listo para ayudarte con esta tarea. ¿Qué necesitas?
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 border-t border-slate-700 bg-slate-800 rounded-b-xl">
                <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Pregunta sobre la tarea..." class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors" autocomplete="off">
                    <button type="submit" id="chat-submit-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg transition-colors flex items-center justify-center min-w-[3rem]">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
